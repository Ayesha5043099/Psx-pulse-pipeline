version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: psx_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: psx_kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: psx_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  minio:
    image: minio/minio:latest
    container_name: psx_minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  airflow-db:
    image: postgres:15
    container_name: psx_airflow_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5434:5432"
    volumes:
      - airflow_db_data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psx_airflow_init
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "psx_pulse_secret_key"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
      MINIO_BUCKET: "psx-data-lake"
      SNOWFLAKE_ACCOUNT: "smjeeps-gf06320"
      SNOWFLAKE_USER: "apna_snowflake_username"
      SNOWFLAKE_PASSWORD: "apna_snowflake_password"
      SNOWFLAKE_WAREHOUSE: "compute_wh"
      SNOWFLAKE_DATABASE: "psx_pulse_db"
      SNOWFLAKE_SCHEMA: "raw_data"
      SNOWFLAKE_ROLE: "accountadmin"
    volumes:
      - ../airflow_dags:/opt/airflow/dags
      - ../ingestion:/opt/airflow/ingestion
      - ../processing:/opt/airflow/processing
      - ../configs:/opt/airflow/configs
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --password admin --firstname Ayesha --lastname Data --role Admin --email admin@example.com"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psx_airflow_webserver
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "psx_pulse_secret_key"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
      MINIO_BUCKET: "psx-data-lake"
      SNOWFLAKE_ACCOUNT: "smjeeps-gf06320"
      SNOWFLAKE_USER: "apna_snowflake_username"
      SNOWFLAKE_PASSWORD: "apna_snowflake_password"
      SNOWFLAKE_WAREHOUSE: "compute_wh"
      SNOWFLAKE_DATABASE: "psx_pulse_db"
      SNOWFLAKE_SCHEMA: "raw_data"
      SNOWFLAKE_ROLE: "accountadmin"
    ports:
      - "8084:8080"
    volumes:
      - ../airflow_dags:/opt/airflow/dags
      - ../ingestion:/opt/airflow/ingestion
      - ../processing:/opt/airflow/processing
      - ../configs:/opt/airflow/configs
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psx_airflow_scheduler
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "psx_pulse_secret_key"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
      MINIO_BUCKET: "psx-data-lake"
      SNOWFLAKE_ACCOUNT: "smjeeps-gf06320"
      SNOWFLAKE_USER: "Ayesha"
      SNOWFLAKE_PASSWORD: "Ayesha@1234567"
      SNOWFLAKE_WAREHOUSE: "compute_wh"
      SNOWFLAKE_DATABASE: "psx_pulse_db"
      SNOWFLAKE_SCHEMA: "raw_data"
      SNOWFLAKE_ROLE: "accountadmin"
    volumes:
      - ../airflow_dags:/opt/airflow/dags
      - ../ingestion:/opt/airflow/ingestion
      - ../processing:/opt/airflow/processing
      - ../configs:/opt/airflow/configs
    command: scheduler

volumes:
  minio_data:
  airflow_db_data: